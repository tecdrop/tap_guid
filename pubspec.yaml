name: tap_guid
description: "Generate, copy, and share UUIDs (GUIDs) with ease! TapGuid offers the most popular formats (standard, braces, URN, Base64, etc.), unique colors for each ID, works offline, and more."

# Not a package, so never publish it to pub.dev
publish_to: 'none'

# The version name, then the build number after the +, which Android uses as
# versionCode and must increase with every Play release
version: 4.1.0+7

environment:
  sdk: ^3.13.7

dependencies:
  # The Flutter framework
  flutter:
    sdk: flutter

  # iOS-style icons font from the Flutter template; not used by the app yet
  cupertino_icons: ^2.0.0

  # Material widgets and theming, from the standalone package instead of the SDK
  material_ui: ^1.8.0

  # Shares the UUID through the platform's share sheet
  share_plus: ^13.3.1

  # Saves the app settings on the device
  shared_preferences: ^2.5.6

  # Typed settings with default values, stored through shared_preferences
  simple_app_preferences: ^0.0.4

  # Opens the help, store, and web search links in the browser or store app
  url_launcher: ^6.3.3

  # Generates the version 1, 4, 6, 7, and 8 UUIDs
  uuid: ^4.6.0

dev_dependencies:
  # Widget and unit testing
  flutter_test:
    sdk: flutter

  # Recommended lints, enabled in analysis_options.yaml
  flutter_lints: ^6.0.0

flutter:
  # Bundles the Material Icons font
  uses-material-design: true

  # Icon font for the drawer's TapGuid symbol and GitHub icon
  fonts:
    - family: CustomIcons
      fonts:
        - asset: assets/fonts/CustomIcons.ttf
